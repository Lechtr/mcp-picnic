services:
  picnic-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PICNIC_USERNAME: ${PICNIC_USERNAME}
      PICNIC_PASSWORD: ${PICNIC_PASSWORD}
      PICNIC_COUNTRY_CODE: ${PICNIC_COUNTRY_CODE:-DE}
    volumes:
      - picnic-session:/root
    expose:
      - "3000"

  mcp-gateway:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    restart: unless-stopped
    environment:
      MCP_SECRET_PATH: ${MCP_SECRET_PATH}
    depends_on:
      - picnic-mcp
    expose:
      - "80"

volumes:
  picnic-session:

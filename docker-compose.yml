services:
  picnic-mcp:
    build: .
    restart: unless-stopped
    environment:
      PICNIC_USERNAME: ${PICNIC_USERNAME}
      PICNIC_PASSWORD: ${PICNIC_PASSWORD}
      PICNIC_COUNTRY_CODE: ${PICNIC_COUNTRY_CODE:-DE}
    volumes:
      - picnic-session:/root
    expose:
      - "3000"

  mcp-gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MCP_SECRET_PATH: ${MCP_SECRET_PATH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - picnic-mcp
    ports:
      - "8080:80"

volumes:
  picnic-session:
